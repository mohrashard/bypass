<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MR2 Labs Vibe Template</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  
  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #040508; /* Deep obsidian */
      font-family: 'Outfit', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ambient Background System */
    .ambient-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
    }
    .glow-blob {
      position: absolute;
      width: 80vw; height: 80vw;
      border-radius: 50%;
      filter: blur(12vh);
      opacity: 0.15;
    }
    .blob-1 { background: #00F0FF; top: -20%; left: -20%; }
    .blob-2 { background: #7C3AED; bottom: -20%; right: -20%; }
    
    .vignette {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 30%, #040508 110%);
      z-index: 1;
      pointer-events: none;
    }

    /* TikTok Safe Zone */
    .tiktok-safe-canvas {
      width: 100vw; height: 100vh;
      padding-top: 15vh; padding-bottom: 25vh;
      padding-left: 5vw; padding-right: 15vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      z-index: 10;
      position: relative;
    }

    /* Camera Drift Wrapper (Null Object) */
    .camera-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 3vh;
    }

    /* Tech Badge (Glassmorphism) */
    .tech-badge {
      display: inline-flex;
      align-items: center;
      gap: 2vw;
      padding: 1.5vh 4vw;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 100vw;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
      transform: scale(0.8);
      opacity: 0;
      overflow: hidden;
      position: relative;
    }
    
    .badge-glow {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.4), transparent);
      transform: translateX(-100%);
    }

    .badge-icon {
      width: 3vw; height: 3vw;
      background: #00F0FF;
      border-radius: 50%;
      box-shadow: 0 0 10px #00F0FF;
    }

    .badge-text {
      font-family: 'JetBrains Mono', monospace;
      color: #00F0FF;
      font-size: 2.5vw;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Track Matte Headline */
    .headline-container {
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      padding: 1vh 0;
    }
    
    .headline {
      font-size: 8.5vw;
      font-weight: 900;
      color: #F8FAFC;
      line-height: 1.05;
      text-transform: uppercase;
      transform: translateY(100%); /* Start hidden for matte reveal */
    }

    .accent-word {
      color: transparent;
      -webkit-text-stroke: 2px #00F0FF;
      text-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
    }

    /* Staggered Subtext */
    .subtext {
      font-size: 4vw;
      font-weight: 400;
      color: #94A3B8;
      max-width: 75vw;
      line-height: 1.4;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8vw;
    }
    .char {
      opacity: 0;
      transform: translateY(2vh);
    }

  </style>
</head>
<body>

  <!-- Ambient Background -->
  <div class="ambient-bg">
    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>
    <div class="vignette"></div>
  </div>

  <div class="tiktok-safe-canvas">
    <div class="camera-wrapper" id="camera">
      
      <!-- Top Badge -->
      <div class="tech-badge" id="badge">
        <div class="badge-glow" id="badgeGlow"></div>
        <div class="badge-icon"></div>
        <div class="badge-text">MR2.LABS_CORE</div>
      </div>

      <!-- Main Headline (Track Matte Reveal) -->
      <div class="headline-container">
        <div class="headline" id="headline1">BUILD THE</div>
      </div>
      <div class="headline-container">
        <div class="headline" id="headline2">IMPOSSIBLE <span class="accent-word">SYSTEM</span></div>
      </div>

      <!-- Subtext (Staggered) -->
      <div class="subtext" id="subtext">
        <!-- JS will inject spanned characters here -->
      </div>

    </div>
  </div>

  <script>
    // --- TONE.JS SOUND DESIGN ---
    // Deep Membrane Sub-Impact
    const impact = new Tone.MembraneSynth({
      pitchDecay: 0.05, octaves: 6, oscillator: { type: "square" },
      envelope: { attack: 0.001, decay: 0.4, sustain: 0, release: 1 }
    }).toDestination();

    // Cinematic Lowpass Swoosh
    const swoosh = new Tone.NoiseSynth({
      noise: { type: "pink" },
      envelope: { attack: 0.05, decay: 0.3, sustain: 0, release: 0.1 }
    });
    const filter = new Tone.Filter(800, "lowpass").toDestination();
    swoosh.connect(filter);

    // Fast UI Typewriter Blip
    const typeBlip = new Tone.Synth({
      oscillator: { type: "sine" },
      envelope: { attack: 0.001, decay: 0.03, sustain: 0, release: 0.03 }
    }).toDestination();
    typeBlip.volume.value = -10;

    // Glass/Tech Ping
    const glassPing = new Tone.MetalSynth({
      frequency: 400, envelope: { attack: 0.001, decay: 0.5, release: 0.1 },
      harmonicity: 8.1, modulationIndex: 20, resonance: 4000, octaves: 1.5
    }).toDestination();
    glassPing.volume.value = -12;

    // --- TEXT SPLITTING LOGIC (For AE Stagger) ---
    const rawSubtext = "Advanced motion graphics generated completely in code.";
    const subContainer = document.getElementById("subtext");
    rawSubtext.split("").forEach(char => {
      if (char === " ") {
        subContainer.innerHTML += `&nbsp;`;
      } else {
        subContainer.innerHTML += `<span class="char">${char}</span>`;
      }
    });

    // --- GSAP ANIMATION TIMELINE ---
    const tl = gsap.timeline();

    // 0.0s: Ambient Camera Drift (Perpetual 2.5D push-in)
    gsap.to("#camera", {
      scale: 1.05,
      y: "-2vh",
      duration: 10,
      ease: "none"
    });
    
    // Ambient Blob Drift
    gsap.to(".blob-1", { x: "10vw", y: "5vh", duration: 8, yoyo: true, repeat: -1, ease: "sine.inOut" });
    gsap.to(".blob-2", { x: "-10vw", y: "-10vh", duration: 10, yoyo: true, repeat: -1, ease: "sine.inOut" });

    // 0.2s: Badge pops in (AE Elastic)
    tl.to("#badge", {
      scale: 1,
      opacity: 1,
      duration: 0.6,
      ease: "back.out(2)",
      onStart: () => glassPing.triggerAttackRelease("16n")
    }, 0.2);

    // 0.5s: Badge Glassmorphism Glow sweep
    tl.to("#badgeGlow", {
      x: "100%",
      duration: 0.6,
      ease: "power2.inOut"
    }, 0.5);

    // 0.6s: AE Track Matte Reveal of Main Headline (Expo Slide)
    tl.to(["#headline1", "#headline2"], {
      y: "0%",
      duration: 0.8,
      stagger: 0.15,
      ease: "expo.out",
      onStart: () => swoosh.triggerAttackRelease("8n")
    }, 0.6);

    // Deep impact hits when the heavy text locks into place
    tl.add(() => impact.triggerAttackRelease("C1", "8n"), 0.8);

    // 1.2s: Subtext Stagger (Typewriter/Cascading AE look)
    tl.to(".char", {
      y: 0,
      opacity: 1,
      duration: 0.4,
      stagger: 0.015,
      ease: "back.out(1.5)",
      onStart: () => {
        // Play blip sound synced to character appearance
        let t = Tone.now();
        for(let i=0; i<rawSubtext.length; i++) {
          if(rawSubtext[i] !== " ") {
            typeBlip.triggerAttackRelease("C6", "32n", t + (i * 0.015));
          }
        }
      }
    }, 1.2);

    // Start audio engine
    window.addEventListener("DOMContentLoaded", () => Tone.start());
  </script>
</body>
</html>
